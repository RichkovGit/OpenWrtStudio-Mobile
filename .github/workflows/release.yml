name: Prepare Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v2.5.23'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare-android:
    name: Check, build and create draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify tag and prevent overwriting a release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-mobile)?$ ]]; then
            echo "::error::Use an existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-mobile tag."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$", manifest, re.M)
          tag_version = os.environ["RELEASE_TAG"][1:].removesuffix("-mobile")
          if match is None or match.group(1) != tag_version:
              raise SystemExit("Release tag must match the version in pubspec.yaml.")
          if not Path("RELEASE_NOTES.md").is_file():
              raise SystemExit("RELEASE_NOTES.md is required.")
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for this tag. This workflow never updates releases."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Run regression tests
        run: flutter test

      - name: Retain existing jni GNU build-id workaround when applicable
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache = Path(os.environ.get("PUB_CACHE") or Path.home() / ".pub-cache")
          for path in cache.glob("hosted/*/jni-*/src/CMakeLists.txt"):
              source = path.read_text(encoding="utf-8")
              if "-Wl,--build-id=none," not in source:
                  path.write_text(source.replace("-Wl,", "-Wl,--build-id=none,"), encoding="utf-8")
          PY

      - name: Restore existing release signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_PROPERTIES_BASE64" ]]; then
            echo "::error::Both existing Android signing secrets are required; no debug-signed release will be prepared."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/luci_mobile_keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          python3 - <<'PY'
          from pathlib import Path

          properties = {}
          for line in Path("android/key.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.lstrip().startswith(("#", "!")):
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()
          if any(not properties.get(key) for key in ("storeFile", "storePassword", "keyAlias", "keyPassword")):
              raise SystemExit("Release signing properties must specify the existing keystore, passwords and alias.")
          raw = properties["storeFile"]
          restored = Path("android/app/luci_mobile_keystore.jks").resolve()
          candidates = [Path("android/app") / raw, Path("android") / raw]
          selected = next((path.resolve() for path in candidates if path.is_file()), None)
          if selected != restored:
              raise SystemExit("storeFile must resolve to the restored android/app/luci_mobile_keystore.jks.")
          PY

      - name: Build APKs for supported ABIs
        run: flutter build apk --split-per-abi --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Collect complete artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for name in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
            test -s "build/app/outputs/flutter-apk/$name"
            cp "build/app/outputs/flutter-apk/$name" release/
          done
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab release/
          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Save build artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-${{ inputs.tag }}
          path: release/
          if-no-files-found: error

      - name: Create draft prerelease after all checks and builds
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenWrt Studio Mobile ${RELEASE_TAG#v}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            --prerelease \
            --latest=false

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/app/luci_mobile_keystore.jks android/key.properties

name: VPN regression and Linux packages
on:
  push:
    branches: [codex/fix-vpn-selection, codex/sync-upstream-2, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-vpn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev liblzma-dev desktop-file-utils patchelf libfuse2 xvfb dbus-x11 gnome-keyring xdotool x11-apps imagemagick
      - run: flutter pub get
      - name: Verify source formatting
        run: |
          mkdir -p checks
          dart format --output=none --set-exit-if-changed .
      - name: Analyze all sources
        run: flutter analyze --fatal-infos
      - name: Run all tests
        run: flutter test --reporter expanded
      - name: Build native Linux application after checks pass
        run: ./scripts/build-linux.sh
      - name: Download official AppImage build tools
        run: |
          mkdir -p build/tools
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o build/tools/linuxdeploy-x86_64.AppImage
          curl -fL https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o build/tools/linuxdeploy-plugin-gtk.sh
          chmod +x build/tools/*
      - name: Package tar archive and AppImage
        run: PATH="$PWD/build/tools:$PATH" LINUXDEPLOY="$PWD/build/tools/linuxdeploy-x86_64.AppImage" ./scripts/package-linux.sh
      - name: Smoke-test native and extracted AppImage
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dbus-run-session -- bash scripts/smoke-linux.sh
      - name: Save generated Linux runner
        if: always()
        run: |
          if [ -d linux ]; then tar -czf checks/linux-runner.tar.gz linux .metadata; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-checks-and-format
          path: checks/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenWrtStudio-linux-x86_64
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS.txt
            LINUX_INSTALL.md
          compression-level: 0
  distro-smoke:
    needs: check-and-build
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'fedora:43']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: Install GUI test prerequisites in the target distribution
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q
            apt-get install -y ca-certificates xvfb dbus-x11 gnome-keyring xdotool imagemagick x11-apps libgtk-3-0 libsecret-1-0 libgl1-mesa-dri libegl1 libgles2 libjsoncpp25
          else
            dnf install -y ca-certificates bash tar gzip findutils which xorg-x11-server-Xvfb dbus-daemon gnome-keyring xdotool ImageMagick gtk3 libsecret jsoncpp mesa-libGL mesa-libEGL mesa-libGLES mesa-dri-drivers
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OpenWrtStudio-linux-x86_64
          path: download
      - name: Verify and launch the extracted AppImage
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          cd download/release
          sha256sum -c SHA256SUMS.txt
          image=$(find . -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$image"
          "$image" --appimage-extract >/dev/null
          cat > smoke.sh <<'SCRIPT'
          set -eu
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          ./squashfs-root/AppRun > startup.log 2>&1 &
          app_pid=$!
          trap 'result=$?; cat startup.log; kill "$app_pid" 2>/dev/null || true; exit "$result"' EXIT
          found=0
          for attempt in {1..25}; do
            kill -0 "$app_pid"
            if xdotool search --onlyvisible --name 'OpenWrt Studio' >/dev/null; then found=1; break; fi
            sleep 1
          done
          test "$found" = 1
          sleep 5
          kill -0 "$app_pid"
          if grep -E 'Unhandled Exception|Failed to load dynamic library|error while loading shared libraries' startup.log; then exit 1; fi
          if command -v xwd >/dev/null; then xwd -root -silent | convert xwd:- screenshot.png; fi
          SCRIPT
          xvfb-run -a dbus-run-session -- bash smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: |
            download/release/startup.log
            download/release/screenshot.png
